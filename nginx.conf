server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        # SPA client-side routing — any unmatched path falls back to index.html
        # so React Router (not nginx) decides what to render.
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
