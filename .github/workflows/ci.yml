name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  build-push-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # These become import.meta.env.VITE_* in the built JS bundle — not
          # secrets, just the one staging environment's public URLs (any
          # browser can see them regardless). There's only one deploy target
          # right now, so hardcoding it here matches how the other repos'
          # pipelines already work; revisit if a second environment shows up.
          build-args: |
            VITE_API_BASE_URL=https://api.staging.flowkeeper.se
            VITE_KEYCLOAK_AUTHORITY=https://auth.staging.flowkeeper.se/realms/flowkeeper
            VITE_KEYCLOAK_CLIENT_ID=flowkeeper-web
          tags: |
            ghcr.io/adez90/flowkeeper-web:latest
            ghcr.io/adez90/flowkeeper-web:${{ github.sha }}

      # Deploys straight to the shared staging server. There's only one
      # environment right now — see flowkeeper-infra's DEPLOYMENT.md — so
      # every merge to main goes live there immediately.
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh "$SSH_USER@$SSH_HOST" '
            cd /opt/flowkeeper &&
            docker compose -f docker-compose.prod.yml pull web &&
            docker compose -f docker-compose.prod.yml up -d web
          '
